<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden – Jered [Nachname]</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #0f2f26;
    --ink: #eaf0e8;
    --muted: #9fb8ab;
    --gold: #d3ae5b;
    --line: rgba(234, 240, 232, 0.18);
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--board);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
    padding: 1.5rem;
    box-sizing: border-box;
  }
  main { max-width: 36rem; }
  svg { display: block; width: 100%; height: 80px; margin-bottom: 2rem; }
  svg path { fill: none; stroke: var(--gold); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  svg .grid { stroke: var(--line); stroke-width: 1; }
  h1 { font-family: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif; font-weight: 600; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; margin: 0 0 1rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  a { color: var(--ink); text-decoration-color: var(--gold); text-underline-offset: 0.2em; }
  a:hover { color: var(--gold); }
</style>
</head>
<body>
<main>
  <!-- Ein paar Taktflanken, dann bleibt die Leitung stehen: kein Signal -->
  <svg viewBox="0 0 600 80" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <path class="grid" d="M0 40H600M0 10H600M0 70H600"/>
    <path d="M0 70H60V10H90V70H120V10H150V70H180V10H210V70H600"/>
  </svg>
  <h1>404 – kein Signal.</h1>
  <p>Diese Seite gibt es nicht (mehr). Vielleicht hat sich die Adresse geändert.</p>
  <a href="./">Zurück zur Startseite</a>
</main>
</body>
</html>
